# Wisp Client Configuration

server: "yourdomain.com:443"
password: "your-password"
sni: "yourdomain.com"

# Local SOCKS5 proxy address.
# Point your browser or system proxy settings here.
listen: "127.0.0.1:1080"

# TLS fingerprint to mimic: chrome (Chrome 155), firefox (Firefox 148) or safari (Safari 26.3)
fingerprint: "chrome"

# Transport mode:
#   "tls"  — Trojan straight over TLS (fastest, the default)
#   "ws"   — WebSocket (works through CDNs that pass WebSockets)
#   "grpc" — an HTTP POST stream that looks like gRPC
transport: "tls"
# The server's websocket path, for ws and grpc
ws_path: "/api/v1/stream"

# Inner encryption (must match server config).
encryption:
  enabled: true
  key: "same-key-as-server"

# The server's key: with pins, the client connects only if the certificate carries one, so TLS
# interception fails. Get it with: wisp-server -config /etc/wisp/server.yaml -pin
# pins: ["sha256/..."]

# Replace the connection every 10 to 20 minutes or 128 to 256 MB (default true).
# rotate: true

# Small random messages every 2 to 8 seconds (default false).
# noise: false
