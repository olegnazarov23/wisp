# Wisp Server Configuration

listen: ":443"

tls:
  cert: "/etc/letsencrypt/live/yourdomain.com/fullchain.pem"
  key: "/etc/letsencrypt/live/yourdomain.com/privkey.pem"

# Each user gets their own password. Server logs show who's connected.
users:
  - name: "alice"
    password: "generate-a-strong-random-password"
  - name: "bob"
    password: "another-strong-random-password"
    max_speed: "10MB"       # 10 MB/s, shared by all of bob's connections (optional)
    max_bandwidth: "50GB"   # 50 GB quota, counted since the server started (optional)

# Where to forward non-VPN traffic (cover website / existing web server).
# Anyone probing your server sees a normal website.
fallback: "127.0.0.1:80"

# The same site over HTTP/2 without TLS (h2c), optional. Browsers ask for HTTP/2; wisp offers it
# only when this is set (Caddy: the global option `servers { protocols h1 h2c }`).
# fallback_h2: "127.0.0.1:80"

# WebSocket/gRPC transport endpoint. Pick your own path: anyone who knows it gets an upgrade
# instead of the cover site.
websocket:
  enabled: true
  path: "/api/v1/stream"

# Inner encryption layer (optional but recommended): keeps content private if TLS is
# intercepted (e.g., with a government-issued CA). Use a long random key.
encryption:
  enabled: true
  key: "generate-a-random-encryption-key"

# Users can't reach loopback, private or link-local addresses through the server (its own
# services, its LAN, cloud metadata) unless this is true.
# allow_private: false

# Log failed destinations (default false: logs never say where users go).
# debug: false
