# Wisp Server Configuration

listen: ":443"

tls:
  cert: "/etc/letsencrypt/live/yourdomain.com/fullchain.pem"
  key: "/etc/letsencrypt/live/yourdomain.com/privkey.pem"

# Each user gets their own password. Server logs show who's connected.
users:
  - name: "alice"
    password: "generate-a-strong-random-password"
  - name: "bob"
    password: "another-strong-random-password"
    max_speed: "10MB"       # 10 MB/s speed limit (optional)
    max_bandwidth: "50GB"   # 50 GB monthly quota (optional)

# Where to forward non-VPN traffic (cover website / existing web server).
# Anyone probing your server sees a normal website.
fallback: "127.0.0.1:80"

# WebSocket/gRPC transport endpoint.
# VPN clients connect here; everyone else sees a normal API path.
websocket:
  enabled: true
  path: "/api/v1/stream"

# Inner encryption layer (optional but recommended).
# Protects against TLS MITM attacks (e.g., government-issued CA certs).
encryption:
  enabled: true
  key: "generate-a-random-encryption-key"
